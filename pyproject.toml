[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adp"
version = "0.0.1"
description = "Autonomous Decision Platform: Sense -> Understand -> Decide -> Act -> Observe -> Learn"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["adp"]

[project.optional-dependencies]
sql = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "aiomysql>=0.2",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "aiomysql>=0.2",
    "httpx>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: launches real OS subprocesses; slower than the rest of the suite",
]
